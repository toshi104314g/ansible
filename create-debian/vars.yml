---
vm_name: debian-kernel

vm_ram: 4096
vm_vcpus: 2
vm_disk_size: 40G

image_dir: /var/lib/libvirt/images

cloud_image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

base_image: "{{ image_dir }}/debian-13-genericcloud-amd64.qcow2"
vm_disk: "{{ image_dir }}/{{ vm_name }}.qcow2"
cloud_init_iso: "{{ image_dir }}/{{ vm_name }}-seed.iso"

bridge_name: br0
global_ipv6_prefix: "2409:"

# VMのMACアドレスは固定
vm_mac: "52:54:00:12:34:56"

# Hostの/etc/hostsに登録する名前
vm_hostname: debian-kernel
