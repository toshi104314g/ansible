---
- name: Validate the unified Linux inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - always

  tasks:
    - name: Require exactly one inventory source
      ansible.builtin.assert:
        that:
          - ansible_inventory_sources is defined
          - ansible_inventory_sources | length == 1
        fail_msg: "Specify exactly one unified Linux inventory with -i."

    - name: Resolve the unified Linux inventory path
      ansible.builtin.command:
        argv:
          - realpath
          - "{{ ansible_inventory_sources | first }}"
      register: unified_linux_inventory_realpath
      changed_when: false
      check_mode: false

    - name: Resolve the home directory of the invoking user
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import os, pwd;
            user = os.environ.get('SUDO_USER');
            print(pwd.getpwnam(user).pw_dir if user else os.path.expanduser('~'))
      register: unified_linux_invoking_user_home
      changed_when: false
      check_mode: false

    - name: Parse the unified Linux inventory
      ansible.builtin.command:
        argv:
          - ansible-inventory
          - --inventory
          - "{{ unified_linux_inventory_realpath.stdout }}"
          - --list
      register: unified_linux_inventory_result
      changed_when: false
      check_mode: false

    - name: Record the unified inventory hosts and requested hostname
      ansible.builtin.set_fact:
        unified_linux_inventory_hostvars: >-
          {{ (unified_linux_inventory_result.stdout | from_json)['_meta']['hostvars'] }}
        unified_linux_requested_hostnames_raw: "{{ hostname | default('') | string | trim }}"
        unified_linux_requested_hostnames: >-
          {{
            hostname.split(',')
            | map('trim')
            | list
            if hostname is defined and (hostname | string | trim | length > 0)
            else []
          }}

    - name: Select inventory hosts requested for this run
      ansible.builtin.set_fact:
        unified_linux_selected_hostvars: >-
          {{
            unified_linux_inventory_hostvars
            | dict2items
            | selectattr('key', 'in', unified_linux_requested_hostnames)
            | items2dict
            if unified_linux_requested_hostnames_raw | length > 0
            else unified_linux_inventory_hostvars
          }}

    - name: Record selected UTM and KVM hosts
      ansible.builtin.set_fact:
        unified_linux_utm_hosts: >-
          {{
            unified_linux_selected_hostvars
            | dict2items
            | selectattr('value.utm_vm_name', 'defined')
            | items2dict
          }}
        unified_linux_kvm_hosts: >-
          {{
            unified_linux_selected_hostvars
            | dict2items
            | selectattr('value.kvm_vm_name', 'defined')
            | items2dict
          }}

    - name: Validate the requested hostname list
      ansible.builtin.assert:
        that:
          - >-
            unified_linux_requested_hostnames_raw | length == 0
            or unified_linux_requested_hostnames | length > 0
          - >-
            unified_linux_requested_hostnames_raw | length == 0
            or '' not in unified_linux_requested_hostnames
          - >-
            unified_linux_requested_hostnames | unique | length
            == unified_linux_requested_hostnames | length
        fail_msg: >-
          Provide a comma-separated list of non-empty, unique inventory hostnames.

    - name: Require all requested hosts to exist in the inventory
      ansible.builtin.assert:
        that:
          - >-
            (
              unified_linux_requested_hostnames
              | difference(unified_linux_inventory_hostvars.keys() | list)
              | length
            ) == 0
        fail_msg: >-
          Inventory hosts not found:
          {{
            unified_linux_requested_hostnames
            | difference(unified_linux_inventory_hostvars.keys() | list)
            | join(', ')
          }}.

    - name: Require at least one host in the unified inventory
      ansible.builtin.assert:
        that:
          - unified_linux_selected_hostvars | length > 0
        fail_msg: "The unified inventory contains no hosts."

    - name: Require both backends when no specific host was requested
      ansible.builtin.assert:
        that:
          - unified_linux_utm_hosts | length > 0
          - unified_linux_kvm_hosts | length > 0
        fail_msg: >-
          Without -e hostname=..., the unified inventory must include at least
          one UTM guest (utm_vm_name) and one KVM guest (kvm_vm_name).
      when: unified_linux_requested_hostnames_raw | length == 0

    - name: Require each selected host to belong to exactly one backend
      ansible.builtin.assert:
        that:
          - >-
            (1 if item.value.utm_vm_name is defined else 0)
            + (1 if item.value.kvm_vm_name is defined else 0) == 1
          - item.value.ansible_host is defined
        fail_msg: >-
          Inventory host '{{ item.key }}' must define ansible_host and exactly
          one of utm_vm_name or kvm_vm_name.
      loop: "{{ unified_linux_selected_hostvars | dict2items }}"

    - name: Require unique IPv4 addresses among selected guests
      ansible.builtin.assert:
        that:
          - >-
            (unified_linux_selected_hostvars.values()
            | map(attribute='ansible_host') | list | unique | length)
            == (unified_linux_selected_hostvars | length)
        fail_msg: "Every UTM and KVM guest must have a unique ansible_host IPv4 address."

    - name: Create a private workspace for the selected inventory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-linux-inventory-
      register: unified_linux_inventory_workspace

    - name: Write the selected hosts to a temporary inventory
      ansible.builtin.copy:
        content: "{{ {'all': {'hosts': unified_linux_selected_hostvars}} | to_nice_yaml }}"
        dest: "{{ unified_linux_inventory_workspace.path }}/inventory.yml"
        mode: "0600"

    - name: Record the selected inventory path
      ansible.builtin.set_fact:
        unified_linux_selected_inventory: "{{ unified_linux_inventory_workspace.path }}/inventory.yml"

- name: Provision UTM and KVM guests in parallel
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tags:
    - create

  vars:
    unified_linux_playbook: "{{ lookup('pipe', 'command -v ansible-playbook') }}"
    unified_linux_inventory: "{{ hostvars['localhost']['unified_linux_selected_inventory'] }}"
    unified_linux_home: "{{ lookup('env', 'HOME') }}"
    unified_linux_path: "{{ lookup('env', 'PATH') }}"
    unified_linux_create_commands:
      - name: utm
        argv:
          - "{{ unified_linux_playbook }}"
          - --inventory
          - "{{ unified_linux_inventory }}"
          - "{{ playbook_dir }}/../create-linux-utm/create-linux-utm.yml"
          - --tags
          - create
          - --skip-tags
          - hosts_file
      - name: kvm
        argv:
          - "{{ unified_linux_playbook }}"
          - --inventory
          - "{{ unified_linux_inventory }}"
          - "{{ playbook_dir }}/../create-linux-kvm-remote/create-linux-kvm-remote.yml"
          - --tags
          - create
          - --skip-tags
          - hosts_file
          - --extra-vars
          - "{{ {'kvm_skip_mac_hosts_file': true} | to_json }}"

  tasks:
    - name: Create a private workspace for backend output
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-linux-backends-
      register: unified_linux_backend_workspace

    - name: Run UTM and KVM provisioning concurrently and collect both exit codes
      ansible.builtin.shell:
        cmd: |
          {% if unified_linux_utm_hosts | length > 0 %}
          {{ unified_linux_create_commands[0].argv | map('quote') | join(' ') }} \
            > {{ (unified_linux_backend_workspace.path ~ '/utm.log') | quote }} 2>&1 &
          utm_pid=$!
          {% else %}
          printf '%s\n' 'UTM backend not selected' > {{ (unified_linux_backend_workspace.path ~ '/utm.log') | quote }}
          utm_pid=
          {% endif %}
          {% if unified_linux_kvm_hosts | length > 0 %}
          {{ unified_linux_create_commands[1].argv | map('quote') | join(' ') }} \
            > {{ (unified_linux_backend_workspace.path ~ '/kvm.log') | quote }} 2>&1 &
          kvm_pid=$!
          {% else %}
          printf '%s\n' 'KVM backend not selected' > {{ (unified_linux_backend_workspace.path ~ '/kvm.log') | quote }}
          kvm_pid=
          {% endif %}

          if [ -n "$utm_pid" ]; then
            wait "$utm_pid"
            utm_rc=$?
          else
            utm_rc=0
          fi
          if [ -n "$kvm_pid" ]; then
            wait "$kvm_pid"
            kvm_rc=$?
          else
            kvm_rc=0
          fi

          printf '%s\n' "$utm_rc" > {{ (unified_linux_backend_workspace.path ~ '/utm.rc') | quote }}
          printf '%s\n' "$kvm_rc" > {{ (unified_linux_backend_workspace.path ~ '/kvm.rc') | quote }}
          exit 0
      changed_when: true
      environment:
        HOME: "{{ unified_linux_invoking_user_home.stdout }}"
        PATH: "{{ unified_linux_path }}"

    - name: Read UTM and KVM provisioning exit codes
      ansible.builtin.command:
        argv:
          - cat
          - "{{ unified_linux_backend_workspace.path }}/{{ item.name }}.rc"
      loop: "{{ unified_linux_create_commands }}"
      loop_control:
        label: "{{ item.name }}"
      register: unified_linux_backend_exit_codes
      changed_when: false

    - name: Read UTM and KVM provisioning output
      ansible.builtin.command:
        argv:
          - cat
          - "{{ unified_linux_backend_workspace.path }}/{{ item.name }}.log"
      loop: "{{ unified_linux_create_commands }}"
      loop_control:
        label: "{{ item.name }}"
      register: unified_linux_backend_output
      changed_when: false

    - name: Build UTM and KVM provisioning results
      ansible.builtin.set_fact:
        unified_linux_child_results: >-
          {{
            unified_linux_child_results | default({})
            | combine({
                item.item.name: {
                  'rc': item.stdout | trim | int,
                  'stdout': (
                    unified_linux_backend_output.results
                    | selectattr('item.name', 'equalto', item.item.name)
                    | map(attribute='stdout')
                    | first
                  ),
                  'finished': true
                }
              })
          }}
      loop: "{{ unified_linux_backend_exit_codes.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Record UTM and KVM guests that failed provisioning
      ansible.builtin.set_fact:
        unified_linux_failed_utm_hosts: >-
          {{
            unified_linux_utm_hosts.keys() | list
            if unified_linux_child_results.utm.rc | default(1) | int != 0
            else unified_linux_child_results.utm.stdout | default('')
              | regex_findall('UTM_SKIPPED_GUEST: ([A-Za-z0-9_.-]+)')
              | unique | list
          }}
        unified_linux_failed_kvm_hosts: >-
          {{
            unified_linux_kvm_hosts.keys() | list
            if unified_linux_child_results.kvm.rc | default(1) | int != 0
            else unified_linux_child_results.kvm.stdout | default('')
              | regex_findall('KVM_SKIPPED_GUEST: ([A-Za-z0-9_.-]+)')
              | unique | list
          }}

    - name: Update Mac hosts entries for successfully provisioned guests
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[ \t]*\S+[ \t]+{{ item.key | regex_escape }}([ \t].*)?$'
        line: "{{ item.value.ansible_host }} {{ item.key }}"
      loop: >-
        {{
          unified_linux_selected_hostvars
          | dict2items
          | rejectattr(
              'key',
              'in',
              (unified_linux_failed_utm_hosts | default([]))
              + (unified_linux_failed_kvm_hosts | default([]))
            )
          | list
        }}
      tags:
        - hosts_file

    - name: Report UTM and KVM provisioning results
      ansible.builtin.debug:
        msg: "{{ item.key }} backend result: {{ item.value | to_nice_json }}"
      loop: "{{ unified_linux_child_results | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Remove the backend output workspace
      ansible.builtin.file:
        path: "{{ unified_linux_backend_workspace.path }}"
        state: absent

    - name: Remove the selected inventory workspace
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['unified_linux_inventory_workspace'].path }}"
        state: absent

    - name: Require UTM and KVM provisioning to succeed
      ansible.builtin.assert:
        that:
          - unified_linux_child_results.utm.rc is defined
          - unified_linux_child_results.utm.rc | default(1) | int == 0
          - unified_linux_child_results.kvm.rc is defined
          - unified_linux_child_results.kvm.rc | default(1) | int == 0
        fail_msg: >-
          One or more backend playbooks failed or did not return an exit code.
          Inspect the full backend results above.

- name: Delete Linux guests on UTM and KVM
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tags:
    - delete
    - never

  vars:
    unified_linux_playbook: "{{ lookup('pipe', 'command -v ansible-playbook') }}"
    unified_linux_inventory: "{{ hostvars['localhost']['unified_linux_selected_inventory'] }}"
    unified_linux_home: "{{ lookup('env', 'HOME') }}"
    unified_linux_path: "{{ lookup('env', 'PATH') }}"
    unified_linux_delete_commands:
      - name: utm
        argv:
          - "{{ unified_linux_playbook }}"
          - --inventory
          - "{{ unified_linux_inventory }}"
          - "{{ playbook_dir }}/../create-linux-utm/create-linux-utm.yml"
          - --tags
          - delete,remove_hosts_file
          - --extra-vars
          - "{{ {'utm_delete_confirmation_input': 'DELETE'} | to_json }}"
      - name: kvm
        argv:
          - "{{ unified_linux_playbook }}"
          - --inventory
          - "{{ unified_linux_inventory }}"
          - "{{ playbook_dir }}/../create-linux-kvm-remote/create-linux-kvm-remote.yml"
          - --tags
          - delete
          - --extra-vars
          - "{{ {'kvm_wrapper_delete_confirmation_input': 'DELETE'} | to_json }}"

  tasks:
    - name: Confirm UTM deletion
      ansible.builtin.pause:
        prompt: "This permanently deletes selected UTM VMs. Type DELETE to continue"
      register: unified_utm_delete_confirmation
      when:
        - hostvars['localhost']['unified_linux_utm_hosts'] | length > 0
        - utm_delete_confirmation_input | default('') != 'DELETE'

    - name: Require UTM deletion confirmation
      ansible.builtin.assert:
        that:
          - >-
            (utm_delete_confirmation_input | default('') == 'DELETE')
            or unified_utm_delete_confirmation.user_input | default('') == 'DELETE'
        fail_msg: "UTM deletion cancelled. The required confirmation is DELETE."
      when: hostvars['localhost']['unified_linux_utm_hosts'] | length > 0

    - name: Confirm KVM deletion
      ansible.builtin.pause:
        prompt: "This permanently deletes selected KVM VMs. Type DELETE to continue"
      register: unified_kvm_delete_confirmation
      when:
        - hostvars['localhost']['unified_linux_kvm_hosts'] | length > 0
        - kvm_wrapper_delete_confirmation_input | default('') != 'DELETE'

    - name: Require KVM deletion confirmation
      ansible.builtin.assert:
        that:
          - >-
            (kvm_wrapper_delete_confirmation_input | default('') == 'DELETE')
            or unified_kvm_delete_confirmation.user_input | default('') == 'DELETE'
        fail_msg: "KVM deletion cancelled. The required confirmation is DELETE."
      when: hostvars['localhost']['unified_linux_kvm_hosts'] | length > 0

    - name: Delete selected UTM guests
      ansible.builtin.command:
        argv: "{{ unified_linux_delete_commands[0].argv }}"
      changed_when: true
      when: hostvars['localhost']['unified_linux_utm_hosts'] | length > 0
      environment:
        HOME: "{{ unified_linux_invoking_user_home.stdout }}"
        PATH: "{{ unified_linux_path }}"

    - name: Delete selected KVM guests
      ansible.builtin.command:
        argv: "{{ unified_linux_delete_commands[1].argv }}"
      changed_when: true
      when: hostvars['localhost']['unified_linux_kvm_hosts'] | length > 0
      environment:
        HOME: "{{ unified_linux_home }}"
        PATH: "{{ unified_linux_path }}"

    - name: Remove the selected inventory workspace after deletion
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['unified_linux_inventory_workspace'].path }}"
        state: absent
