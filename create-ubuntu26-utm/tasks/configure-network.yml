    - name: Configure static IPv4 and preserve IPv6 SLAAC on cloned Ubuntu VMs
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.name] }}"
          - sudo
          - -n
          - /usr/bin/bash
          - -s
        stdin: |
          set -e
          netplan_file=/etc/netplan/99-ansible-utm.yaml
          interface={{ utm_network_connection | quote }}
          mac_address=$(cat "/sys/class/net/$interface/address")
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file"' EXIT
          cat > "$temp_file" <<NETPLAN
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ utm_network_connection | to_json }}:
                match:
                  macaddress: {{ '${mac_address}' }}
                set-name: {{ utm_network_connection | to_json }}
                dhcp4: false
                dhcp6: false
                accept-ra: true
                addresses:
                  - {{ (item.ipv4_address ~ '/' ~ utm_ipv4_prefix_length) | to_json }}
                routes:
                  - to: default
                    via: {{ utm_ipv4_gateway | to_json }}
                nameservers:
                  addresses: {{ utm_ipv4_dns_servers | to_json }}
          NETPLAN
          if ! cmp -s "$temp_file" "$netplan_file"; then
            install -m 600 "$temp_file" "$netplan_file"
            netplan generate
            netplan apply
            echo changed
          fi
      register: utm_static_ipv4_updates
      changed_when: "'changed' in utm_static_ipv4_updates.stdout"
      loop: "{{ utm_clone_vms }}"

    - name: Verify static IPv4 and SLAAC on cloned Ubuntu VMs
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.name] }}"
          - sudo
          - -n
          - /usr/bin/bash
          - -s
        stdin: |
          set -e
          grep -Eq '^[[:space:]]+dhcp4: false$' /etc/netplan/99-ansible-utm.yaml
          grep -Eq '^[[:space:]]+accept-ra: true$' /etc/netplan/99-ansible-utm.yaml
          ip -4 -o address show dev {{ utm_network_connection | quote }} |
            awk '{print $4}' |
            grep -Fxq {{ (item.ipv4_address ~ '/' ~ utm_ipv4_prefix_length) | quote }}
          ip -6 address show dev {{ utm_network_connection | quote }} scope global |
            grep -q 'inet6'
      register: utm_static_ipv4_verification
      changed_when: false
      until: utm_static_ipv4_verification.rc == 0
      retries: "{{ utm_poll_retries }}"
      delay: "{{ utm_poll_delay }}"
      loop: "{{ utm_clone_vms }}"
