    - name: Check cloned virtual machine identity markers
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.name] }}"
          - sudo
          - -n
          - /usr/bin/test
          - -f
          - /var/lib/ansible-utm-clone-initialized
      register: utm_identity_markers
      changed_when: false
      failed_when: utm_identity_markers.rc not in [0, 1]
      loop: "{{ utm_clone_vms }}"

    - name: Read uninitialized VM hostnames
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.item.name] }}"
          - /usr/bin/hostname
      register: utm_current_hostnames
      changed_when: false
      loop: "{{ utm_identity_markers.results }}"
      when: item.rc != 0

    - name: Refuse to modify uninitialized VMs that are not clean template clones
      ansible.builtin.assert:
        that:
          - item.stdout | trim in ['localhost', 'localhost.localdomain', item.item.item.hostname]
        fail_msg: >-
          UTM VM '{{ item.item.item.name }}' is not marked as a fresh clone and
          has hostname '{{ item.stdout | trim }}'; refusing to change it.
      loop: "{{ utm_current_hostnames.results | selectattr('skipped', 'undefined') | list }}"

    - name: Initialize uninitialized cloned Ubuntu virtual machines
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.item.name] }}"
          - sudo
          - -n
          - /usr/bin/bash
          - -s
        stdin: |
          set -e
          hostnamectl set-hostname {{ item.item.hostname }}
          truncate -s 0 /etc/machine-id
          systemd-machine-id-setup
          rm -f /etc/ssh/ssh_host_*
          ssh-keygen -A
          systemctl restart ssh
          touch /var/lib/ansible-utm-clone-initialized
      loop: "{{ utm_identity_markers.results }}"
      when: item.rc != 0

    - name: Remove old SSH host keys after regenerating guest identities
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -R
          - "{{ utm_vm_ipv6[item.item.name] }}"
          - -f
          - "{{ utm_ssh_known_hosts_file }}"
      loop: "{{ utm_identity_markers.results }}"
      when: item.rc != 0
      changed_when: true

    - name: Ensure cloned guest hostnames match the inventory
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.name] }}"
          - sudo
          - -n
          - /usr/bin/bash
          - -s
        stdin: |
          set -e
          if [ "$(hostname)" != {{ item.hostname | quote }} ]; then
            hostnamectl set-hostname {{ item.hostname | quote }}
            echo changed
          fi
      register: utm_clone_hostname_updates
      changed_when: "'changed' in utm_clone_hostname_updates.stdout"
      loop: "{{ utm_clone_vms }}"

    - name: Verify cloned virtual machine hostnames
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -i
          - "{{ utm_ssh_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
          - "{{ utm_guest_ssh_user }}@{{ utm_vm_ipv6[item.name] }}"
          - /usr/bin/hostname
      register: utm_verified_hostnames
      changed_when: false
      until: utm_verified_hostnames.stdout | trim == item.hostname
      retries: "{{ utm_poll_retries }}"
      delay: "{{ utm_poll_delay }}"
      loop: "{{ utm_clone_vms }}"
