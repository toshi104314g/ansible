---
- name: Prepare the selected KVM inventory on the Mac
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - always

  vars:
    kvm_controller_ssh_alias: ubuntu
    kvm_mac_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    kvm_mac_ssh_public_key_file: "{{ kvm_mac_ssh_private_key_file }}.pub"

  tasks:
    - name: Require exactly one inventory source selected with -i
      ansible.builtin.assert:
        that:
          - ansible_inventory_sources is defined
          - ansible_inventory_sources | length == 1
        fail_msg: "Specify exactly one VM inventory file with -i."

    - name: Record the selected VM inventory path
      ansible.builtin.command:
        argv:
          - realpath
          - "{{ ansible_inventory_sources | first }}"
      register: kvm_selected_inventory_realpath
      changed_when: false

    - name: Parse the selected VM inventory on the Mac
      ansible.builtin.command:
        argv:
          - ansible-inventory
          - --inventory
          - "{{ kvm_selected_inventory_realpath.stdout }}"
          - --list
      register: kvm_selected_inventory_result
      changed_when: false

    - name: Record selected KVM guest hosts
      ansible.builtin.set_fact:
        kvm_selected_guest_hostvars: >-
          {{ (kvm_selected_inventory_result.stdout | from_json)['_meta']['hostvars'] }}

    - name: Determine the requested KVM operation
      ansible.builtin.set_fact:
        kvm_wrapper_action: "{{ 'delete' if 'delete' in ansible_run_tags else 'create' }}"
        kvm_wrapper_run_remote: >-
          {{
            'all' in ansible_run_tags
            or 'create' in ansible_run_tags
            or 'delete' in ansible_run_tags
          }}

    - name: Require at least one KVM guest
      ansible.builtin.assert:
        that:
          - kvm_selected_guest_hostvars | length > 0
        fail_msg: "The selected KVM inventory has no guests."

    - name: Require valid VM hostnames and IPv4 addresses
      ansible.builtin.assert:
        that:
          - item.key is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - item.value.ansible_host is defined
          - item.value.ansible_host is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          - item.value.ansible_host.split('.') | map('int') | select('gt', 255) | list | length == 0
        fail_msg: >-
          Each selected inventory host must have a valid ansible_host IPv4 address;
          inventory hostname '{{ item.key }}' is invalid.
      loop: "{{ kvm_selected_guest_hostvars | dict2items }}"

    - name: Check the Mac SSH key pair
      ansible.builtin.stat:
        path: "{{ item }}"
      register: kvm_mac_ssh_key_stats
      loop:
        - "{{ kvm_mac_ssh_private_key_file }}"
        - "{{ kvm_mac_ssh_public_key_file }}"
      when: kvm_wrapper_action == 'create'

    - name: Require the Mac SSH private and public key files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required Mac SSH key file not found: {{ item.item }}"
      loop: "{{ kvm_mac_ssh_key_stats.results }}"
      when: kvm_wrapper_action == 'create'

    - name: Derive the public key from the Mac private key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -y
          - -f
          - "{{ kvm_mac_ssh_private_key_file }}"
      register: kvm_mac_derived_public_key
      changed_when: false
      no_log: true
      when: kvm_wrapper_action == 'create'

    - name: Verify the Mac public key matches its private key
      ansible.builtin.assert:
        that:
          - >-
            kvm_mac_derived_public_key.stdout.split()[:2]
            == lookup('ansible.builtin.file', kvm_mac_ssh_public_key_file).split()[:2]
        fail_msg: "The Mac SSH public key does not match the configured private key."
      no_log: true
      when: kvm_wrapper_action == 'create'

    - name: Confirm deletion of inventory KVM virtual machines
      ansible.builtin.pause:
        prompt: >-
          This permanently deletes the KVM VMs listed in the selected inventory.
          Type DELETE to continue
      register: kvm_wrapper_delete_confirmation
      when:
        - kvm_wrapper_action == 'delete'
        - kvm_wrapper_delete_confirmation_input | default('') != 'DELETE'

    - name: Prompt for Ubuntu sudo password when Ubuntu hosts file will change
      ansible.builtin.pause:
        prompt: "Ubuntu KVM host sudo password"
        echo: false
      register: kvm_ubuntu_become_password_input
      when:
        - hostvars['localhost']['kvm_wrapper_run_remote'] | bool
        - "'ubuntu_hosts_file' in ansible_run_tags"

    - name: Store the Ubuntu sudo password for delegated hosts-file updates
      ansible.builtin.set_fact:
        kvm_ubuntu_become_password: "{{ kvm_ubuntu_become_password_input.user_input }}"
      no_log: true
      when:
        - hostvars['localhost']['kvm_wrapper_run_remote'] | bool
        - "'ubuntu_hosts_file' in ansible_run_tags"

    - name: Require explicit deletion confirmation
      ansible.builtin.assert:
        that:
          - >-
            (kvm_wrapper_delete_confirmation_input | default('') == 'DELETE')
            or (kvm_wrapper_delete_confirmation.user_input | default('') == 'DELETE')
        fail_msg: "Deletion cancelled. The required confirmation is DELETE."
      when: kvm_wrapper_action == 'delete'

    - name: Record the Mac public-key file path for remote staging
      ansible.builtin.set_fact:
        kvm_mac_ssh_public_key_file: "{{ kvm_mac_ssh_public_key_file }}"
      when: kvm_wrapper_action == 'create'

    - name: Register the Ubuntu KVM host for SSH delegation
      ansible.builtin.add_host:
        name: kvm_remote_execution_host
        groups: kvm_remote_execution_hosts
        ansible_host: "{{ kvm_controller_ssh_alias }}"
        ansible_connection: ssh

- name: Run KVM provisioning on the Ubuntu host
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - always
  vars:
    kvm_controller_ssh_alias: ubuntu

  tasks:
    - name: Create a private temporary workspace on Ubuntu
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-linux-kvm-
      register: kvm_remote_workspace
      delegate_to: kvm_remote_execution_host
      when: hostvars['localhost']['kvm_wrapper_run_remote'] | bool

    - name: Stage inventory, playbook, and Mac public key on Ubuntu
      block:
        - name: Copy the selected VM inventory to Ubuntu
          ansible.builtin.copy:
            src: "{{ hostvars['localhost']['kvm_selected_inventory_realpath'].stdout }}"
            dest: "{{ kvm_remote_workspace.path }}/inventory.yml"
            mode: "0600"
          delegate_to: kvm_remote_execution_host

        - name: Copy the KVM playbook to Ubuntu
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../create-linux-kvm/"
            dest: "{{ kvm_remote_workspace.path }}/create-linux-kvm/"
            directory_mode: "0755"
          delegate_to: kvm_remote_execution_host

        - name: Copy the Mac public key to Ubuntu
          ansible.builtin.copy:
            src: "{{ hostvars['localhost']['kvm_mac_ssh_public_key_file'] }}"
            dest: "{{ kvm_remote_workspace.path }}/mac-id_ed25519.pub"
            mode: "0600"
          delegate_to: kvm_remote_execution_host
          when: hostvars['localhost']['kvm_wrapper_action'] == 'create'

        - name: Build the Ubuntu KVM playbook command
          ansible.builtin.set_fact:
            kvm_remote_playbook_argv: >-
              {{
                [
                  '/usr/bin/ansible-playbook',
                  '--inventory',
                  kvm_remote_workspace.path ~ '/inventory.yml',
                  kvm_remote_workspace.path ~ '/create-linux-kvm/create-linux-kvm.yml',
                  '--tags',
                  hostvars['localhost']['kvm_wrapper_action']
                ]
                + (
                    ['--skip-tags', 'create']
                    if hostvars['localhost']['kvm_wrapper_action'] == 'delete'
                    else ['--skip-tags', 'hosts_file']
                  )
                + [
                    '--extra-vars',
                    {
                      'kvm_additional_ssh_public_key_file':
                        kvm_remote_workspace.path ~ '/mac-id_ed25519.pub'
                        if hostvars['localhost']['kvm_wrapper_action'] == 'create' else '',
                      'kvm_delete_confirmed':
                        hostvars['localhost']['kvm_wrapper_action'] == 'delete'
                    } | to_json
                  ]
              }}

        - name: Run the KVM playbook on Ubuntu using the Mac-selected inventory
          ansible.builtin.command:
            argv: "{{ kvm_remote_playbook_argv }}"
          register: kvm_remote_playbook_result
          changed_when: true
          environment:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          delegate_to: kvm_remote_execution_host

        - name: Report the Ubuntu KVM playbook result
          ansible.builtin.debug:
            var: kvm_remote_playbook_result.stdout_lines

        - name: Update Ubuntu hosts entries for selected KVM guests
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '^[ \t]*\S+[ \t]+{{ item.key | regex_escape }}([ \t].*)?$'
            line: "{{ item.value.ansible_host }} {{ item.key }}"
          loop: "{{ hostvars['localhost']['kvm_selected_guest_hostvars'] | dict2items }}"
          become: true
          delegate_to: kvm_remote_execution_host
          vars:
            ansible_become_password: "{{ hostvars['localhost']['kvm_ubuntu_become_password'] }}"
          when:
            - hostvars['localhost']['kvm_wrapper_action'] == 'create'
            - "'ubuntu_hosts_file' in ansible_run_tags"

        - name: Report Ubuntu hosts file updates
          ansible.builtin.debug:
            msg: >-
              Added or updated Ubuntu /etc/hosts entries for
              {{ hostvars['localhost']['kvm_selected_guest_hostvars'].keys() | list | join(', ') }}.
          when:
            - hostvars['localhost']['kvm_wrapper_action'] == 'create'
            - "'ubuntu_hosts_file' in ansible_run_tags"
      always:
        - name: Remove the temporary Ubuntu workspace
          ansible.builtin.file:
            path: "{{ kvm_remote_workspace.path }}"
            state: absent
          delegate_to: kvm_remote_execution_host
          when: hostvars['localhost']['kvm_wrapper_run_remote'] | bool
      when: hostvars['localhost']['kvm_wrapper_run_remote'] | bool

    - name: Update Mac hosts entries for selected KVM guests
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[ \t]*\S+[ \t]+{{ item.key | regex_escape }}([ \t].*)?$'
        line: "{{ item.value.ansible_host }} {{ item.key }}"
      loop: "{{ hostvars['localhost']['kvm_selected_guest_hostvars'] | dict2items }}"
      become: true
      when: hostvars['localhost']['kvm_wrapper_action'] == 'create'
      register: kvm_mac_hosts_update_result

    - name: Verify Mac hosts entries were written
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -F
          - -x
          - --
          - "{{ item.value.ansible_host }} {{ item.key }}"
          - /etc/hosts
      loop: "{{ hostvars['localhost']['kvm_selected_guest_hostvars'] | dict2items }}"
      register: kvm_mac_hosts_verification
      changed_when: false
      failed_when: false
      when: hostvars['localhost']['kvm_wrapper_action'] == 'create'

    - name: Require selected guest entries in Mac hosts file
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: >-
          Expected /etc/hosts to contain '{{ item.item.value.ansible_host }} {{ item.item.key }}',
          but it was not found after the update task. Check the task output and Mac sudo privileges.
      loop: "{{ kvm_mac_hosts_verification.results | default([]) }}"
      when: hostvars['localhost']['kvm_wrapper_action'] == 'create'

    - name: Report Mac hosts file updates
      ansible.builtin.debug:
        msg: >-
          Verified /etc/hosts entries for
          {{ hostvars['localhost']['kvm_selected_guest_hostvars'].keys() | list | join(', ') }}.
          Update task results: {{ kvm_mac_hosts_update_result.results
            | map(attribute='changed') | list }}.
      when: hostvars['localhost']['kvm_wrapper_action'] == 'create'

- name: Remove deleted VMs from the Ubuntu and Mac hosts files
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tags:
    - delete
    - never

  tasks:
    - name: Remove deleted KVM guest entries from Ubuntu hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[ \t]*\S+[ \t]+{{ item.key | regex_escape }}([ \t].*)?$'
        state: absent
      loop: "{{ hostvars['localhost']['kvm_selected_guest_hostvars'] | dict2items }}"
      delegate_to: kvm_remote_execution_host
      vars:
        ansible_become_password: "{{ hostvars['localhost']['kvm_ubuntu_become_password'] }}"
      when: "'ubuntu_hosts_file' in ansible_run_tags"
      tags:
        - ubuntu_hosts_file

    - name: Remove deleted KVM guest entries from Mac hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[ \t]*\S+[ \t]+{{ item.key | regex_escape }}([ \t].*)?$'
        state: absent
      loop: "{{ hostvars['localhost']['kvm_selected_guest_hostvars'] | dict2items }}"

    - name: Report hosts file cleanup
      ansible.builtin.debug:
        msg: >-
          Removed /etc/hosts entries for
          {{ hostvars['localhost']['kvm_selected_guest_hostvars'].keys() | list | join(', ') }}
          from Ubuntu and Mac.
