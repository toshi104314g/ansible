---
all:
  children:
    linux_guests:
      vars:
        utm_provision: clone
      hosts:
        files1:
          utm_os: rocky9
          utm_template_name: rocky9-template
          utm_vm_name: roxky9-1
          ansible_host: "192.168.10.40"
        ubuntu1:
          utm_os: ubuntu26
          utm_template_name: ubuntu26-template
          utm_vm_name: ubuntu26-1
          ansible_host: "192.168.10.41"

  vars:
    utm_network_connection: enp0s1
    utm_global_ipv6_prefix: "2409:"
    utm_ipv4_prefix_length: 24
    utm_ipv4_gateway: 192.168.10.1
    utm_ipv4_dns_servers:
      - 192.168.10.1
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts.ansible-utm
