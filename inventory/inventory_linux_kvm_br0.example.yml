---
all:
  children:
    linux_kvm_guests:
      vars:
        kvm_provision: clone
      hosts:
        rocky9-br0:
          kvm_os: rocky9
          kvm_template_image: Rocky-9-GenericCloud.latest.x86_64.qcow2
          kvm_vm_name: rocky9-br0
          ansible_host: "192.168.10.40"
        ubuntu26-br0:
          kvm_os: ubuntu26
          kvm_template_image: ubuntu-26.04-cloudimg-amd64.img
          kvm_vm_name: ubuntu26-br0
          ansible_host: "192.168.10.41"

  vars:
    # Connect guest interfaces directly to the host's Linux bridge.
    kvm_bridge_name: br0
    kvm_storage_pool: default
    kvm_ipv4_prefix_length: 24
    kvm_ipv4_gateway: 192.168.10.1
    kvm_ipv4_dns_servers:
      - 192.168.10.1
