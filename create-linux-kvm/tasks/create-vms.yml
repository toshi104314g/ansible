---
- name: Provision Linux KVM guests from the selected inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../vars.yml

  tasks:
    - name: Load and validate the Linux KVM inventory
      ansible.builtin.import_tasks: load-provisioning-config.yml
      tags:
        - always
        - kvm_inventory

    - name: Check KVM host and libvirt prerequisites
      ansible.builtin.import_tasks: check-prerequisites.yml
      when: kvm_clone_vms | length > 0

    - name: Require all template images in the selected storage pool
      ansible.builtin.import_tasks: check-template-images.yml
      when: kvm_clone_vms | length > 0

    - name: Prepare cloud-init data for cloned guests
      ansible.builtin.import_tasks: prepare-cloud-init.yml
      when: kvm_clone_vms | length > 0

    - name: Clone and start KVM guests
      ansible.builtin.import_tasks: clone-vms.yml
      when: kvm_clone_vms | length > 0

    - name: Wait for guest SSH and verify provisioned identities
      ansible.builtin.import_tasks: verify-guests.yml
      when: kvm_clone_vms | length > 0

    - name: Start and configure existing KVM guests
      ansible.builtin.import_tasks: configure-existing.yml
      when: kvm_existing_vms | length > 0

    - name: Update the Ubuntu controller's hosts file
      ansible.builtin.import_tasks: update-hosts.yml
      tags:
        - hosts_file
