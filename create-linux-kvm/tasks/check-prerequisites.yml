---
- name: Check KVM management commands
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - --version
  register: kvm_tool_versions
  changed_when: false
  loop:
    - virsh
    - virt-install
    - qemu-img

- name: Verify system libvirt is reachable
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ kvm_connection }}"
      - list
      - --all
      - --name
  register: kvm_domain_list
  changed_when: false

- name: Verify the selected storage pool is active
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ kvm_connection }}"
      - pool-info
      - "{{ kvm_storage_pool }}"
  register: kvm_pool_info
  changed_when: false
  failed_when: kvm_pool_info.stdout | regex_search('(?m)^State:\\s+running$') is none

- name: Locate arping for temporary KVM management
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v arping
  register: kvm_arping_path
  changed_when: false
  failed_when: false
  when: kvm_clone_vms | selectattr('temporary_management', 'equalto', true) | list | length > 0

- name: Require arping for temporary KVM management
  ansible.builtin.assert:
    that:
      - kvm_arping_path.rc == 0
    fail_msg: >-
      Temporary management requires arping on the KVM host.
      Install iputils-arping before provisioning.
  when: kvm_clone_vms | selectattr('temporary_management', 'equalto', true) | list | length > 0

- name: Verify requested libvirt networks are active
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ kvm_connection }}"
      - net-info
      - "{{ item }}"
  register: kvm_network_info
  changed_when: false
  failed_when: kvm_network_info.stdout | regex_search('(?m)^Active:\\s+yes$') is none
  loop: "{{ kvm_required_network_names }}"

- name: Verify requested host interfaces are active Linux bridges
  ansible.builtin.command:
    argv:
      - ip
      - -json
      - -details
      - link
      - show
      - dev
      - "{{ item }}"
  register: kvm_bridge_info
  changed_when: false
  failed_when: >-
    (kvm_bridge_info.stdout | from_json | length != 1)
    or (kvm_bridge_info.stdout | from_json | first).linkinfo.info_kind != 'bridge'
    or 'UP' not in (kvm_bridge_info.stdout | from_json | first).flags
  loop: "{{ kvm_required_bridge_names }}"

- name: Record registered libvirt domain names
  ansible.builtin.set_fact:
    kvm_domain_names: "{{ kvm_domain_list.stdout_lines | reject('equalto', '') | list }}"
