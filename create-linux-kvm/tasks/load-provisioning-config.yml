---
- name: Require exactly one inventory source selected with -i
  ansible.builtin.assert:
    that:
      - ansible_inventory_sources is defined
      - ansible_inventory_sources | length == 1
    fail_msg: "Specify exactly one inventory file with -i. No default inventory is used."

- name: Record the selected inventory path
  ansible.builtin.set_fact:
    kvm_inventory_path: "{{ ansible_inventory_sources | first }}"

- name: Check that the selected inventory is a regular file
  ansible.builtin.stat:
    path: "{{ kvm_inventory_path }}"
  register: kvm_inventory_file

- name: Require a valid inventory file
  ansible.builtin.assert:
    that:
      - kvm_inventory_file.stat.exists
      - kvm_inventory_file.stat.isreg
    fail_msg: "Selected KVM inventory '{{ kvm_inventory_path }}' is not a regular file."

- name: Parse selected inventory
  ansible.builtin.command:
    argv:
      - ansible-inventory
      - --inventory
      - "{{ kvm_inventory_path }}"
      - --list
  register: kvm_inventory_result
  changed_when: false

- name: Record inventory host variables
  ansible.builtin.set_fact:
    kvm_inventory_hostvars: >-
      {{
        (kvm_inventory_result.stdout | from_json)['_meta']['hostvars']
        | dict2items
        | selectattr('value.kvm_vm_name', 'defined')
        | items2dict
      }}

- name: Require at least one inventory host
  ansible.builtin.assert:
    that:
      - kvm_inventory_hostvars | length > 0
    fail_msg: "The KVM inventory has no hosts."

- name: Validate required KVM host variables
  ansible.builtin.assert:
    that:
      - item.value.kvm_os is defined
      - item.value.kvm_os in ['rocky9', 'ubuntu26']
      - item.value.kvm_template_image is defined
      - item.value.kvm_template_image | length > 0
      - item.value.kvm_vm_name is defined
      - item.value.kvm_vm_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - item.value.kvm_vm_name != (item.value.kvm_template_image | basename)
      - item.value.kvm_provision is defined
      - item.value.kvm_provision in ['clone', 'existing']
      - >-
        item.value.ansible_host is defined
        or (
          item.value.kvm_temporary_management | default(false) | bool
          and item.value.kvm_provision == 'clone'
          and item.value.private_ipv4_dhcp | default(false) | bool
        )
      - >-
        item.value.ansible_host is not defined
        or (
          item.value.ansible_host is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          and item.value.ansible_host.split('.') | map('int') | select('gt', 255) | list | length == 0
        )
      - >-
        not (item.value.kvm_temporary_management | default(false) | bool)
        or (
          item.value.kvm_temporary_management | bool
          and item.value.ansible_host is not defined
          and item.value.private_ipv4_dhcp | default(false) | bool
          and item.value.kvm_os == 'rocky9'
          and item.value.kvm_management_connection_type | default('') == 'bridge'
          and item.value.private_ipv4_bridge_name
            != (
              item.value.kvm_temporary_management_bridge_name
              | default(item.value.kvm_management_connection_name | default(''))
            )
        )
      - >-
        not (
          item.value.kvm_network_name is defined
          and item.value.kvm_bridge_name is defined
        )
      - >-
        item.value.kvm_network_name is defined
        or item.value.kvm_bridge_name is defined
        or (
          item.value.kvm_management_connection_type | default('') in ['bridge', 'network']
          and item.value.kvm_management_connection_name | default('') | length > 0
        )
      - item.value.kvm_network_name is not defined or item.value.kvm_network_name | length > 0
      - item.value.kvm_bridge_name is not defined or item.value.kvm_bridge_name is match('^[A-Za-z0-9_.-]+$')
      - >-
        item.value.private_ipv4_bridge_name is not defined
        or item.value.private_ipv4_bridge_name is match('^[A-Za-z0-9_.-]+$')
      - >-
        (
          item.value.private_ipv4_address is not defined
          and item.value.private_ipv4_dhcp | default(false) | bool == false
        )
        or item.value.private_ipv4_bridge_name is defined
      - >-
        item.value.private_ipv4_address is not defined
        or (
          item.value.private_ipv4_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          and item.value.private_ipv4_address.split('.') | map('int') | select('gt', 255) | list | length == 0
          and item.value.private_ipv4_address.split('.')[-1] | int > 0
          and item.value.private_ipv4_address.split('.')[-1] | int < 255
        )
      - >-
        not (item.value.private_ipv4_dhcp | default(false) | bool)
        or (
          item.value.private_ipv4_bridge_name
          == (
            item.value.kvm_bridge_name
            | default(
                item.value.kvm_management_connection_name
                if item.value.kvm_network_name is not defined
                  and item.value.kvm_management_connection_type | default('') == 'bridge'
                else ''
              )
          )
        )
      - >-
        not (
          item.value.private_ipv4_address is defined
          and not (item.value.private_ipv4_dhcp | default(false) | bool)
          and item.value.private_ipv4_bridge_name
            == (
              item.value.kvm_bridge_name
              | default(
                  item.value.kvm_management_connection_name
                  if item.value.kvm_network_name is not defined
                    and item.value.kvm_management_connection_type | default('') == 'bridge'
                  else ''
                )
            )
        )
      - item.value.kvm_storage_pool is defined
      - item.value.kvm_ipv4_prefix_length is defined
      - item.value.kvm_ipv4_prefix_length | int >= 1
      - item.value.kvm_ipv4_prefix_length | int <= 32
      - item.value.kvm_ipv4_gateway is defined
      - item.value.kvm_ipv4_dns_servers is defined
      - item.value.kvm_ipv4_dns_servers | length > 0
      - >-
        item.value.lab_ipv4_address is not defined
        or (
          item.value.lab_ipv4_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          and item.value.lab_ipv4_address.split('.') | map('int') | select('gt', 255) | list | length == 0
          and item.value.lab_ipv4_address.split('.')[-1] | int > 0
          and item.value.lab_ipv4_address.split('.')[-1] | int < 255
        )
      - >-
        item.value.dmz_ipv4_address is not defined
        or (
          item.value.dmz_ipv4_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
          and item.value.dmz_ipv4_address.split('.') | map('int') | select('gt', 255) | list | length == 0
          and item.value.dmz_ipv4_address.split('.')[-1] | int > 0
          and item.value.dmz_ipv4_address.split('.')[-1] | int < 255
        )
      - >-
        item.value.lab_ipv4_address is not defined
        or item.value.dmz_ipv4_address is not defined
        or item.value.lab_ipv4_address != item.value.dmz_ipv4_address
      - >-
        (
          item.value.kvm_bridge_name
          | default(
              item.value.kvm_management_connection_name
              if item.value.kvm_network_name is not defined
                and item.value.kvm_management_connection_type | default('') == 'bridge'
              else ''
            )
        ) != item.value.kvm_lab_bridge_name
        or item.value.lab_ipv4_address is not defined
      - >-
        (
          item.value.kvm_bridge_name
          | default(
              item.value.kvm_management_connection_name
              if item.value.kvm_network_name is not defined
                and item.value.kvm_management_connection_type | default('') == 'bridge'
              else ''
            )
        ) != item.value.kvm_dmz_bridge_name
        or item.value.dmz_ipv4_address is not defined
      - >-
        (
          item.value.lab_ipv4_address is not defined
          and item.value.dmz_ipv4_address is not defined
        )
        or item.value.kvm_ipv4_gateway == '192.168.10.1'
    fail_msg: >-
      Host '{{ item.key }}' must specify kvm_os (rocky9 or ubuntu26),
      kvm_template_image, kvm_vm_name, kvm_provision, and either ansible_host
      or a DHCP-enabled temporary-management configuration, plus a valid
      network attachment, kvm_storage_pool, and IPv4 network settings.
      Optional LAB, DMZ, and private addresses must be usable host addresses.
      Hosts using LAB or DMZ must retain 192.168.10.1 as their management
      default gateway. Guests without a management address must use
      kvm_temporary_management with a DHCP-enabled private bridge.
  loop: "{{ kvm_inventory_hostvars | dict2items }}"

- name: Require unique VM names and IPv4 addresses
  ansible.builtin.assert:
    that:
      - (kvm_inventory_hostvars.values() | map(attribute='kvm_vm_name') | list | unique | length) == (kvm_inventory_hostvars | length)
      - >-
        (
          kvm_inventory_hostvars.values()
          | selectattr('ansible_host', 'defined')
          | map(attribute='ansible_host')
          | list
          | unique
          | length
        )
        ==
        (
          kvm_inventory_hostvars.values()
          | selectattr('ansible_host', 'defined')
          | list
          | length
        )
    fail_msg: "Inventory KVM VM names and IPv4 addresses must be unique."

- name: Require consistent storage and network settings
  ansible.builtin.assert:
    that:
      - (kvm_inventory_hostvars.values() | map(attribute='kvm_storage_pool') | unique | length) == 1
      - (kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_prefix_length') | unique | length) == 1
      - (kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_gateway') | unique | length) == 1
      - (kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_dns_servers') | unique | length) == 1
    fail_msg: >-
      Hosts in one KVM inventory must use the same storage pool, network mode
      and name, IPv4 prefix length, gateway, and DNS servers.

- name: Require SSH keys for cloud-init access
  ansible.builtin.stat:
    path: "{{ item }}"
  register: kvm_ssh_key_stats
  loop:
    - "{{ kvm_ssh_private_key_file }}"
    - "{{ kvm_ssh_public_key_file }}"

- name: Validate SSH key files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Required SSH key file not found: {{ item.item }}"
  loop: "{{ kvm_ssh_key_stats.results }}"

- name: Record the public key for cloud-init
  ansible.builtin.set_fact:
    kvm_ssh_public_key: "{{ lookup('ansible.builtin.file', kvm_ssh_public_key_file) | trim }}"
  no_log: true

- name: Derive the KVM management public key from the private key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ kvm_ssh_private_key_file }}"
  register: kvm_derived_ssh_public_key
  changed_when: false
  no_log: true

- name: Require the KVM public and private keys to match
  ansible.builtin.assert:
    that:
      - kvm_derived_ssh_public_key.stdout.split()[:2] == kvm_ssh_public_key.split()[:2]
    fail_msg: "The KVM SSH public key does not match the configured private key."
  no_log: true

- name: Check the optional additional guest SSH public key
  ansible.builtin.stat:
    path: "{{ kvm_additional_ssh_public_key_file }}"
  register: kvm_additional_ssh_public_key_stat
  when: kvm_additional_ssh_public_key_file | length > 0

- name: Require the optional additional guest SSH public key
  ansible.builtin.assert:
    that:
      - kvm_additional_ssh_public_key_stat.stat.exists
      - kvm_additional_ssh_public_key_stat.stat.isreg
    fail_msg: "Additional guest SSH public key not found: {{ kvm_additional_ssh_public_key_file }}"
  when: kvm_additional_ssh_public_key_file | length > 0

- name: Record the optional additional guest SSH public key
  ansible.builtin.set_fact:
    kvm_additional_ssh_public_key: >-
      {{ lookup('ansible.builtin.file', kvm_additional_ssh_public_key_file) | trim }}
  no_log: true
  when: kvm_additional_ssh_public_key_file | length > 0

- name: Build the authorized SSH key list for guests
  ansible.builtin.set_fact:
    kvm_guest_ssh_public_keys: >-
      {{
        [kvm_ssh_public_key]
        + ([kvm_additional_ssh_public_key] if kvm_additional_ssh_public_key_file | length > 0 else [])
      }}
  no_log: true

- name: Initialize clone, existing, and delete target lists
  ansible.builtin.set_fact:
    kvm_clone_vms: []
    kvm_existing_vms: []
    kvm_delete_targets: []

- name: Build guest target lists from inventory
  ansible.builtin.set_fact:
    kvm_clone_vms: >-
      {{
        kvm_clone_vms + ([{
          'inventory_hostname': item.key,
          'hostname': item.key,
          'name': item.value.kvm_vm_name,
          'os': item.value.kvm_os,
          'ssh_user': linux_ansible_user,
          'bootstrap_user': 'root' if item.value.kvm_os == 'rocky9' else 'toshiyuki',
          'template_image': item.value.kvm_template_image | basename,
          'ipv4_address': item.value.ansible_host | default(''),
          'network_name': item.value.kvm_network_name | default(
            item.value.kvm_management_connection_name
            if item.value.kvm_bridge_name is not defined
              and item.value.kvm_management_connection_type | default('') == 'network'
            else ''
          ),
          'bridge_name': item.value.kvm_bridge_name | default(
            item.value.kvm_management_connection_name
            if item.value.kvm_network_name is not defined
              and item.value.kvm_management_connection_type | default('') == 'bridge'
            else ''
          ),
          'storage_pool': item.value.kvm_storage_pool,
          'prefix_length': item.value.kvm_ipv4_prefix_length,
          'gateway': item.value.kvm_ipv4_gateway,
          'dns_servers': item.value.kvm_ipv4_dns_servers,
          'lab_ipv4_address': item.value.lab_ipv4_address | default(''),
          'dmz_ipv4_address': item.value.dmz_ipv4_address | default(''),
          'private_ipv4_address': item.value.private_ipv4_address | default(''),
          'private_ipv4_bridge_name': item.value.private_ipv4_bridge_name | default(''),
          'private_ipv4_dhcp': item.value.private_ipv4_dhcp | default(false) | bool,
          'temporary_management': item.value.kvm_temporary_management | default(false) | bool,
          'provisioning_bridge_name': (
            item.value.kvm_temporary_management_bridge_name
            | default(item.value.kvm_management_connection_name | default(''))
            if item.value.kvm_temporary_management | default(false) | bool
            else (
              item.value.kvm_bridge_name
              | default(
                  item.value.kvm_management_connection_name
                  if item.value.kvm_network_name is not defined
                    and item.value.kvm_management_connection_type | default('') == 'bridge'
                  else ''
                )
            )
          ),
          'memory_mb': item.value.kvm_memory_mb | default(kvm_default_memory_mb),
          'vcpus': item.value.kvm_vcpus | default(kvm_default_vcpus),
          'additional_bridge_names':
            (
              [item.value.kvm_lab_bridge_name]
              if item.value.lab_ipv4_address is defined
              else []
            )
            +
            (
              [item.value.kvm_dmz_bridge_name]
              if item.value.dmz_ipv4_address is defined
              else []
            )
            +
            (
              [item.value.private_ipv4_bridge_name]
              if item.value.private_ipv4_bridge_name is defined
                and (
                  item.value.kvm_temporary_management | default(false) | bool
                  or item.value.private_ipv4_bridge_name != (
                    item.value.kvm_bridge_name
                    | default(
                        item.value.kvm_management_connection_name
                        if item.value.kvm_network_name is not defined
                          and item.value.kvm_management_connection_type | default('') == 'bridge'
                        else ''
                      )
                  )
                )
              else []
            )
        }] if item.value.kvm_provision == 'clone' else [])
      }}
    kvm_existing_vms: >-
      {{
        kvm_existing_vms + ([{
          'inventory_hostname': item.key,
          'hostname': item.key,
          'name': item.value.kvm_vm_name,
          'os': item.value.kvm_os,
          'ssh_user': linux_ansible_user,
          'bootstrap_user': 'root' if item.value.kvm_os == 'rocky9' else 'toshiyuki',
          'ipv4_address': item.value.ansible_host | default(''),
          'network_name': item.value.kvm_network_name | default(
            item.value.kvm_management_connection_name
            if item.value.kvm_bridge_name is not defined
              and item.value.kvm_management_connection_type | default('') == 'network'
            else ''
          ),
          'bridge_name': item.value.kvm_bridge_name | default(
            item.value.kvm_management_connection_name
            if item.value.kvm_network_name is not defined
              and item.value.kvm_management_connection_type | default('') == 'bridge'
            else ''
          ),
          'provisioning_bridge_name': item.value.kvm_bridge_name | default(
            item.value.kvm_management_connection_name
            if item.value.kvm_network_name is not defined
              and item.value.kvm_management_connection_type | default('') == 'bridge'
            else ''
          ),
          'prefix_length': item.value.kvm_ipv4_prefix_length,
          'gateway': item.value.kvm_ipv4_gateway,
          'dns_servers': item.value.kvm_ipv4_dns_servers,
          'lab_ipv4_address': item.value.lab_ipv4_address | default(''),
          'dmz_ipv4_address': item.value.dmz_ipv4_address | default(''),
          'private_ipv4_address': item.value.private_ipv4_address | default(''),
          'private_ipv4_bridge_name': item.value.private_ipv4_bridge_name | default(''),
          'private_ipv4_dhcp': item.value.private_ipv4_dhcp | default(false) | bool,
          'additional_bridge_names':
            (
              [item.value.kvm_lab_bridge_name]
              if item.value.lab_ipv4_address is defined
              else []
            )
            +
            (
              [item.value.kvm_dmz_bridge_name]
              if item.value.dmz_ipv4_address is defined
              else []
            )
            +
            (
              [item.value.private_ipv4_bridge_name]
              if item.value.private_ipv4_bridge_name is defined
                and item.value.private_ipv4_bridge_name != (
                  item.value.kvm_bridge_name
                  | default(
                      item.value.kvm_management_connection_name
                      if item.value.kvm_network_name is not defined
                        and item.value.kvm_management_connection_type | default('') == 'bridge'
                      else ''
                    )
                )
              else []
            )
        }] if item.value.kvm_provision == 'existing' else [])
      }}
    kvm_delete_targets: >-
      {{
        kvm_delete_targets + [{
          'inventory_hostname': item.key,
          'name': item.value.kvm_vm_name,
          'template_image': item.value.kvm_template_image | basename,
          'provision': item.value.kvm_provision
        }]
      }}
  loop: "{{ kvm_inventory_hostvars | dict2items }}"

- name: Require each KVM VM to resolve to one management attachment
  ansible.builtin.assert:
    that:
      - (item.network_name | length > 0) != (item.bridge_name | length > 0)
      - item.additional_bridge_names | length <= 2
    fail_msg: >-
      KVM guest '{{ item.name }}' must resolve to exactly one management
      network or bridge attachment and may request at most two additional
      bridges.
  loop: "{{ kvm_clone_vms + kvm_existing_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record common storage and network settings
  ansible.builtin.set_fact:
    kvm_storage_pool: "{{ kvm_inventory_hostvars.values() | map(attribute='kvm_storage_pool') | first }}"
    kvm_ipv4_prefix_length: "{{ kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_prefix_length') | first }}"
    kvm_ipv4_gateway: "{{ kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_gateway') | first }}"
    kvm_ipv4_dns_servers: "{{ kvm_inventory_hostvars.values() | map(attribute='kvm_ipv4_dns_servers') | first }}"
    kvm_additional_bridge_names: >-
      {{
        (
          (kvm_clone_vms | map(attribute='additional_bridge_names') | flatten | list)
          +
          (kvm_existing_vms | map(attribute='additional_bridge_names') | flatten | list)
        )
        | unique
        | list
      }}
    kvm_primary_bridge_names: >-
      {{
        (kvm_clone_vms + kvm_existing_vms)
        | map(attribute='provisioning_bridge_name')
        | reject('equalto', '')
        | unique
        | list
      }}
    kvm_primary_network_names: >-
      {{
        (kvm_clone_vms + kvm_existing_vms)
        | map(attribute='network_name')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Combine requested KVM bridge and network attachments
  ansible.builtin.set_fact:
    kvm_required_bridge_names: "{{ (kvm_primary_bridge_names + kvm_additional_bridge_names) | unique | list }}"
    kvm_required_network_names: "{{ kvm_primary_network_names }}"
