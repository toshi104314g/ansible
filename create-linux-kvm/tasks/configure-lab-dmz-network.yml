---
- name: Read bridge interfaces for KVM guest {{ kvm_secondary_network_vm.name }}
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ kvm_connection }}"
      - domiflist
      - "{{ kvm_secondary_network_vm.name }}"
  register: kvm_secondary_network_interfaces
  changed_when: false

- name: Require each configured KVM network bridge on {{ kvm_secondary_network_vm.name }}
  ansible.builtin.assert:
    that:
      - >-
        kvm_secondary_network_vm.lab_ipv4_address | default('') | length == 0
        or kvm_lab_interface_macs | length == 1
      - >-
        kvm_secondary_network_vm.dmz_ipv4_address | default('') | length == 0
        or kvm_dmz_interface_macs | length == 1
    fail_msg: >-
      KVM guest '{{ kvm_secondary_network_vm.name }}' must have exactly one
      interface attached to each requested LAB/DMZ bridge before its IP can be
      configured.
  vars:
    kvm_lab_interface_macs: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_lab_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
      }}
    kvm_dmz_interface_macs: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_dmz_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
      }}

- name: Configure LAB and DMZ profiles on KVM Rocky guests
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ kvm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ kvm_ssh_known_hosts_file }}"
      - "{{ kvm_secondary_network_vm.ssh_user }}@{{ kvm_secondary_network_vm.ipv4_address }}"
      - sudo
      - -n
      - /usr/bin/bash
      - -s
    stdin: |
      set -euo pipefail

      wait_for_ipv4_address() {
        local interface=$1
        local address=$2
        for attempt in {1..10}; do
          if ip -4 -o address show dev "$interface" |
             awk '{print $4}' | grep -Fxq "$address"; then
            return 0
          fi
          sleep 1
        done
        return 1
      }

      interface_for_mac() {
        target_mac=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
        for address_file in /sys/class/net/*/address; do
          [ -r "$address_file" ] || continue
          current_mac=$(tr '[:upper:]' '[:lower:]' < "$address_file")
          if [ "$current_mac" = "$target_mac" ]; then
            interface=${address_file%/address}
            printf '%s\n' "${interface##*/}"
            return 0
          fi
        done
        return 1
      }

      configure_profile() {
        profile=$1
        mac_address=$2
        address=$3
        interface=$(interface_for_mac "$mac_address")
        changed=0

        if ! nmcli -g NAME connection show | grep -Fxq "$profile"; then
          active_profile=$(nmcli -g GENERAL.CONNECTION device show "$interface")
          if [ -n "$active_profile" ] && [ "$active_profile" != "--" ]; then
            nmcli connection modify "$active_profile" connection.id "$profile"
          else
            nmcli connection add type ethernet con-name "$profile" ifname "$interface"
          fi
          changed=1
        fi

        current_gateway=$(nmcli -g ipv4.gateway connection show "$profile")
        [ "$current_gateway" != "--" ] || current_gateway=
        current_dns=$(nmcli -g ipv4.dns connection show "$profile")
        [ "$current_dns" != "--" ] || current_dns=
        current_mac=$(nmcli -g 802-3-ethernet.mac-address connection show "$profile")
        [ "$current_mac" != "--" ] || current_mac=
        if [ "$(nmcli -g connection.interface-name connection show "$profile")" != "$interface" ] ||
           [ "$(printf '%s' "$current_mac" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$mac_address" | tr '[:upper:]' '[:lower:]')" ] ||
           [ "$(nmcli -g connection.autoconnect connection show "$profile")" != yes ] ||
           [ "$(nmcli -g ipv4.method connection show "$profile")" != manual ] ||
           [ "$(nmcli -g ipv4.addresses connection show "$profile")" != "$address" ] ||
           [ -n "$current_gateway" ] ||
           [ -n "$current_dns" ] ||
           [ "$(nmcli -g ipv4.ignore-auto-dns connection show "$profile")" != yes ] ||
           [ "$(nmcli -g ipv4.never-default connection show "$profile")" != yes ] ||
           [ "$(nmcli -g ipv6.method connection show "$profile")" != auto ] ||
           [ "$(nmcli -g ipv6.never-default connection show "$profile")" != yes ]; then
          nmcli connection modify "$profile" \
            connection.interface-name "$interface" \
            802-3-ethernet.mac-address "$mac_address" \
            connection.autoconnect yes \
            ipv4.method manual \
            ipv4.addresses "$address" \
            ipv4.gateway "" \
            ipv4.dns "" \
            ipv4.ignore-auto-dns yes \
            ipv4.never-default yes \
            ipv6.method auto \
            ipv6.never-default yes
          changed=1
        fi

        active_profile=$(nmcli -g GENERAL.CONNECTION device show "$interface")
        if [ "$active_profile" != "$profile" ]; then
          if [ -n "$active_profile" ] && [ "$active_profile" != "--" ]; then
            nmcli connection modify "$active_profile" connection.autoconnect no
          fi
          nmcli connection up "$profile" ifname "$interface"
          changed=1
        elif [ "$changed" -eq 1 ]; then
          nmcli device reapply "$interface"
        fi

        wait_for_ipv4_address "$interface" "$address"
        if [ "$changed" -eq 1 ]; then
          echo changed
        fi
      }

      management_interface=$(ip -4 -o address show |
        awk -v address={{ (kvm_secondary_network_vm.ipv4_address ~ '/' ~ kvm_secondary_network_vm.prefix_length) | quote }} '$4 == address {print $2; exit}')
      test -n "$management_interface"
      management_profile=$(nmcli -g GENERAL.CONNECTION device show "$management_interface")
      current_gateway=$(nmcli -g ipv4.gateway connection show "$management_profile")
      [ "$current_gateway" != "--" ] || current_gateway=
      if [ "$current_gateway" != 192.168.10.1 ] ||
         [ "$(nmcli -g ipv4.never-default connection show "$management_profile")" != no ]; then
        nmcli connection modify "$management_profile" \
          ipv4.gateway 192.168.10.1 \
          ipv4.never-default no
        nmcli device reapply "$management_interface"
        echo changed
      fi

      {% if kvm_secondary_network_vm.lab_ipv4_address | default('') | length > 0 %}
      configure_profile lab-net {{ kvm_lab_interface_mac | quote }} {{ (kvm_secondary_network_vm.lab_ipv4_address ~ '/24') | quote }}
      {% endif %}
      {% if kvm_secondary_network_vm.dmz_ipv4_address | default('') | length > 0 %}
      configure_profile dmz-net {{ kvm_dmz_interface_mac | quote }} {{ (kvm_secondary_network_vm.dmz_ipv4_address ~ '/24') | quote }}
      {% endif %}

      default_routes=$(ip -4 route show default)
      [ "$(printf '%s\n' "$default_routes" | wc -l | tr -d ' ')" -eq 1 ]
      printf '%s\n' "$default_routes" | grep -Fq 'via 192.168.10.1'
  register: kvm_rocky_lab_dmz_result
  changed_when: "'changed' in kvm_rocky_lab_dmz_result.stdout"
  when: kvm_secondary_network_vm.os == 'rocky9'
  vars:
    kvm_lab_interface_mac: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_lab_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
        | first | default('')
      }}
    kvm_dmz_interface_mac: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_dmz_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
        | first | default('')
      }}

- name: Configure LAB and DMZ Netplan profiles on KVM Ubuntu guests
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ kvm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ kvm_ssh_known_hosts_file }}"
      - "{{ kvm_secondary_network_vm.ssh_user }}@{{ kvm_secondary_network_vm.ipv4_address }}"
      - sudo
      - -n
      - /usr/bin/bash
      - -s
    stdin: |
      set -euo pipefail
      netplan_file=/etc/netplan/99-ansible-lab-dmz.yaml
      temp_file=$(mktemp)
      trap 'rm -f "$temp_file"' EXIT
      cat > "$temp_file" <<NETPLAN
      network:
        version: 2
        renderer: networkd
        ethernets:
      {% if kvm_secondary_network_vm.lab_ipv4_address | default('') | length > 0 %}
          lab:
            match:
              macaddress: {{ kvm_lab_interface_mac | lower | to_json }}
            set-name: lab0
            dhcp4: false
            dhcp6: true
            accept-ra: true
            dhcp6-overrides:
              use-routes: false
              use-dns: false
            ra-overrides:
              use-dns: false
            addresses:
              - {{ (kvm_secondary_network_vm.lab_ipv4_address ~ '/24') | to_json }}
      {% endif %}
      {% if kvm_secondary_network_vm.dmz_ipv4_address | default('') | length > 0 %}
          dmz:
            match:
              macaddress: {{ kvm_dmz_interface_mac | lower | to_json }}
            set-name: dmz0
            dhcp4: false
            dhcp6: true
            accept-ra: true
            dhcp6-overrides:
              use-routes: false
              use-dns: false
            ra-overrides:
              use-dns: false
            addresses:
              - {{ (kvm_secondary_network_vm.dmz_ipv4_address ~ '/24') | to_json }}
      {% endif %}
      NETPLAN
      if ! cmp -s "$temp_file" "$netplan_file"; then
        install -m 600 "$temp_file" "$netplan_file"
        netplan generate
        netplan apply
        echo changed
      fi
      default_routes=$(ip -4 route show default)
      [ "$(printf '%s\n' "$default_routes" | wc -l | tr -d ' ')" -eq 1 ]
      printf '%s\n' "$default_routes" | grep -Fq 'via 192.168.10.1'
      {% if kvm_secondary_network_vm.lab_ipv4_address | default('') | length > 0 %}
      ip -4 -o address show dev lab0 | awk '{print $4}' | grep -Fxq {{ (kvm_secondary_network_vm.lab_ipv4_address ~ '/24') | quote }}
      {% endif %}
      {% if kvm_secondary_network_vm.dmz_ipv4_address | default('') | length > 0 %}
      ip -4 -o address show dev dmz0 | awk '{print $4}' | grep -Fxq {{ (kvm_secondary_network_vm.dmz_ipv4_address ~ '/24') | quote }}
      {% endif %}
  register: kvm_ubuntu_lab_dmz_result
  changed_when: "'changed' in kvm_ubuntu_lab_dmz_result.stdout"
  when: kvm_secondary_network_vm.os == 'ubuntu26'
  vars:
    kvm_lab_interface_mac: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_lab_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
        | first | default('')
      }}
    kvm_dmz_interface_mac: >-
      {{
        kvm_secondary_network_interfaces.stdout
        | regex_findall(
            '(?m)^\s+\S+\s+bridge\s+'
            ~ (kvm_dmz_bridge_name | regex_escape)
            ~ '\s+\S+\s+([0-9A-Fa-f:]{17})\s*$'
          )
        | first | default('')
      }}
