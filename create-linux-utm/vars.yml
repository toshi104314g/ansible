---
utmctl_command: utmctl

utm_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
utm_ssh_public_key_file: "{{ utm_ssh_private_key_file }}.pub"
utm_ssh_known_hosts_file: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts.ansible-utm"
linux_ansible_user: ansible-user

utm_poll_retries: 30
utm_poll_delay: 5
