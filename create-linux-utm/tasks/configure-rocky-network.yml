---
- name: Configure static IPv4 and IPv6 SLAAC on Rocky clones
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "root@{{ utm_vm_ipv6[item.name] }}"
      - /usr/bin/bash
      - -s
    stdin: |
      set -e
      connection={{ item.network_connection | quote }}
      address={{ (item.ipv4_address ~ '/' ~ item.ipv4_prefix_length) | quote }}
      gateway={{ item.ipv4_gateway | quote }}
      dns={{ (item.ipv4_dns_servers | join(',')) | quote }}
      if [ "$(nmcli -g ipv4.method connection show "$connection")" != manual ] ||
         [ "$(nmcli -g ipv4.addresses connection show "$connection")" != "$address" ] ||
         [ "$(nmcli -g ipv4.gateway connection show "$connection")" != "$gateway" ] ||
         [ "$(nmcli -g ipv4.dns connection show "$connection")" != "$dns" ] ||
         [ "$(nmcli -g ipv6.method connection show "$connection")" != auto ]; then
        nmcli connection modify "$connection" \
          ipv4.method manual \
          ipv4.addresses "$address" \
          ipv4.gateway "$gateway" \
          ipv4.dns "$dns" \
          ipv4.ignore-auto-dns yes \
          ipv6.method auto
        nmcli device reapply "$connection"
        echo changed
      fi
  register: utm_rocky_network_updates
  changed_when: "'changed' in utm_rocky_network_updates.stdout"
  loop: "{{ utm_clone_vms | selectattr('os', 'equalto', 'rocky9') | list }}"

- name: Verify static IPv4 on Rocky clones
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "root@{{ utm_vm_ipv6[item.name] }}"
      - /usr/bin/bash
      - -s
    stdin: |
      set -e
      test "$(nmcli -g ipv4.method connection show {{ item.network_connection | quote }})" = manual
      test "$(nmcli -g ipv4.addresses connection show {{ item.network_connection | quote }})" = {{ (item.ipv4_address ~ '/' ~ item.ipv4_prefix_length) | quote }}
      test "$(ip -4 -o address show dev {{ item.network_connection | quote }} | awk '{print $4}')" = {{ (item.ipv4_address ~ '/' ~ item.ipv4_prefix_length) | quote }}
  register: utm_rocky_network_verification
  changed_when: false
  until: utm_rocky_network_verification.rc == 0
  retries: "{{ utm_poll_retries }}"
  delay: "{{ utm_poll_delay }}"
  loop: "{{ utm_clone_vms | selectattr('os', 'equalto', 'rocky9') | list }}"

- name: Report configured Rocky clones
  ansible.builtin.debug:
    msg: >-
      {{ item.hostname }} configured with static IPv4
      {{ item.ipv4_address }}/{{ item.ipv4_prefix_length }} and IPv6 SLAAC.
  loop: "{{ utm_clone_vms | selectattr('os', 'equalto', 'rocky9') | list }}"
