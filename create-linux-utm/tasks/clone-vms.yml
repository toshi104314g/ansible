---
- name: List registered UTM VMs before cloning
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - list
  register: utm_clone_initial_list
  changed_when: false

- name: Parse registered VM names before cloning
  ansible.builtin.set_fact:
    utm_vm_names: >-
      {{
        utm_clone_initial_list.stdout_lines
        | map('regex_replace', '^\S+\s+\S+\s+', '')
        | reject('equalto', 'Name')
        | list
      }}

- name: Refuse guest names that collide with template VMs
  ansible.builtin.assert:
    that:
      - item.name not in (utm_inventory_hostvars.values() | map(attribute='utm_template_name') | list)
    fail_msg: "Guest '{{ item.name }}' cannot use any template name from the inventory."
  loop: "{{ utm_clone_vms }}"

- name: Clone missing UTM virtual machines from each host template
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - clone
      - "{{ item.template_name }}"
      - --name
      - "{{ item.name }}"
  loop: "{{ utm_clone_vms }}"
  when: item.name not in utm_vm_names

- name: Wait for cloned VMs to be registered
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - list
  register: utm_clone_list
  changed_when: false
  until: >-
    utm_clone_list.stdout_lines
    | select('search', '\s' ~ (item.name | regex_escape) ~ '$')
    | list | length > 0
  retries: "{{ utm_poll_retries }}"
  delay: "{{ utm_poll_delay }}"
  loop: "{{ utm_clone_vms }}"

- name: Check cloned VM status
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - status
      - "{{ item.name }}"
  register: utm_start_status
  changed_when: false
  loop: "{{ utm_clone_vms }}"

- name: Start stopped cloned VMs
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - start
      - "{{ item.item.name }}"
  loop: "{{ utm_start_status.results }}"
  when: item.stdout | trim != 'started'

- name: Wait for cloned VMs to start
  ansible.builtin.command:
    argv:
      - "{{ utmctl_command }}"
      - status
      - "{{ item.name }}"
  register: utm_running_status
  changed_when: false
  until: utm_running_status.stdout | trim == 'started'
  retries: "{{ utm_poll_retries }}"
  delay: "{{ utm_poll_delay }}"
  loop: "{{ utm_clone_vms }}"
