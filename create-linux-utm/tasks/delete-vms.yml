---
- name: Delete Linux UTM virtual machines listed in the selected inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../vars.yml
  vars:
    utm_require_ssh_alias: false

  tasks:
    - name: Confirm deletion of inventory virtual machines
      ansible.builtin.pause:
        prompt: >-
          This permanently deletes the UTM VMs listed in the provisioning
          inventory. Type DELETE to continue
      register: utm_delete_confirmation
      tags:
        - delete
        - never

    - name: Require explicit confirmation before deleting virtual machines
      ansible.builtin.assert:
        that:
          - utm_delete_confirmation.user_input == 'DELETE'
        fail_msg: "Deletion cancelled. The required confirmation is DELETE."
      tags:
        - delete
        - never

    - name: Load and validate the Linux UTM inventory
      ansible.builtin.import_tasks: load-provisioning-config.yml
      tags:
        - utm_inventory

    - name: List UTM VMs and protect all selected templates
      ansible.builtin.import_tasks: load-delete-targets.yml
      tags:
        - utm_inventory

    - name: Stop and delete inventory virtual machines
      ansible.builtin.import_tasks: delete-inventory-vms.yml

    - name: Remove inventory host entries from the Mac hosts file
      ansible.builtin.import_tasks: remove-hosts.yml
      tags:
        - remove_hosts_file
