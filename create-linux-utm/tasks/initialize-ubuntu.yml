---
- name: Check Ubuntu clone identity markers
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "toshiyuki@{{ utm_vm_ipv6[item.name] }}"
      - sudo
      - -n
      - /usr/bin/test
      - -f
      - /var/lib/ansible-utm-clone-initialized
  register: utm_ubuntu_identity_markers
  changed_when: false
  failed_when: utm_ubuntu_identity_markers.rc not in [0, 1]
  loop: "{{ utm_clone_vms | selectattr('os', 'equalto', 'ubuntu26') | list }}"

- name: Read uninitialized Ubuntu clone hostnames
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "toshiyuki@{{ utm_vm_ipv6[item.item.name] }}"
      - /usr/bin/hostname
  register: utm_ubuntu_current_hostnames
  changed_when: false
  loop: "{{ utm_ubuntu_identity_markers.results }}"
  when: item.rc != 0

- name: Refuse to initialize non-template Ubuntu guests
  ansible.builtin.assert:
    that:
      - item.stdout | trim in ['localhost', 'localhost.localdomain', item.item.item.hostname]
    fail_msg: >-
      UTM VM '{{ item.item.item.name }}' has unexpected hostname
      '{{ item.stdout | trim }}'; refusing to initialize it.
  loop: "{{ utm_ubuntu_current_hostnames.results | selectattr('skipped', 'undefined') | list }}"

- name: Initialize fresh Ubuntu clone identities
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "toshiyuki@{{ utm_vm_ipv6[item.item.name] }}"
      - sudo
      - -n
      - /usr/bin/bash
      - -s
    stdin: |
      set -e
      hostnamectl set-hostname {{ item.item.hostname | quote }}
      truncate -s 0 /etc/machine-id
      systemd-machine-id-setup
      rm -f /etc/ssh/ssh_host_*
      ssh-keygen -A
      systemctl restart ssh
      touch /var/lib/ansible-utm-clone-initialized
  loop: "{{ utm_ubuntu_identity_markers.results }}"
  when: item.rc != 0

- name: Remove old Ubuntu clone host keys from known_hosts
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ utm_vm_ipv6[item.item.name] }}"
      - -f
      - "{{ utm_ssh_known_hosts_file }}"
  loop: "{{ utm_ubuntu_identity_markers.results }}"
  when: item.rc != 0
  changed_when: true

- name: Verify Ubuntu clone hostnames
  ansible.builtin.command:
    argv:
      - ssh
      - -6
      - -i
      - "{{ utm_ssh_private_key_file }}"
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=5
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ utm_ssh_known_hosts_file }}"
      - "toshiyuki@{{ utm_vm_ipv6[item.name] }}"
      - /usr/bin/hostname
  register: utm_ubuntu_verified_hostname
  changed_when: false
  until: utm_ubuntu_verified_hostname.stdout | trim == item.hostname
  retries: "{{ utm_poll_retries }}"
  delay: "{{ utm_poll_delay }}"
  loop: "{{ utm_clone_vms | selectattr('os', 'equalto', 'ubuntu26') | list }}"
