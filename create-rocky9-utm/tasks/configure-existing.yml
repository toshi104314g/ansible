---
- name: Configure existing UTM guests from the source inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../vars.yml

  tasks:
    - name: Load the UTM provisioning inventory
      ansible.builtin.import_tasks: load-provisioning-config.yml
      tags:
        - utm_inventory

    - name: Prepare and identify existing inventory guests
      ansible.builtin.import_tasks: prepare-files1.yml
      when: utm_existing_vms | length > 0

    - name: Configure and verify existing guest network identities
      ansible.builtin.import_tasks: configure-files1.yml
      when: utm_existing_vms | length > 0

    - name: Update the Mac hosts file
      ansible.builtin.import_tasks: update-hosts.yml
